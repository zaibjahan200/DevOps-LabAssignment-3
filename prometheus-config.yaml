apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    rule_files:
      - /etc/prometheus/alert.rules.yml

    alerting:
      alertmanagers:
        - static_configs:
            - targets:
                - alertmanager-service:9093

    scrape_configs:
      - job_name: "apache"
        static_configs:
          - targets: ["webapp-service:9117"]

  alert.rules.yml: |
    groups:
      - name: apache-alerts
        rules:
          - alert: HighTraffic
            expr: rate(apache_accesses_total[1m]) > 10
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "High Apache traffic detected"